<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>وحدة التحكم اليدوي بالروبوت</title>
  <style>
    @font-face {
      font-family: 'Electrolise';
      src: url('/Electrolise.ttf') format('truetype');
    }

    /* Base Styles */
    body {
      margin: 20px;
      min-height: 100vh;
      place-items: center;
      background-color: #c1c1f8;
      background-image: url('/background.svg');
      background-size: 300px auto;
      background-repeat: no-repeat;
      background-position: center center;
      background-attachment: fixed;
      font-family: 'Electrolise', Arial, sans-serif;
      overflow: hidden;
    }

    .content-container {
      background-color: rgba(224, 240, 250, 0.85);
      border-radius: 15px;
      padding: 20px;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      box-sizing: border-box;
      text-align: center;
    }

    /* Header Layout */
    .header-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      position: relative;
    }

    .header-container h2 {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      margin: 0;
      width: max-content;
      font-size: 20px;
      font-weight: 600;
      color: #333;
    }

    .spacer {
      width: 120px;
      visibility: hidden;
    }

    /* Button Styles */
    button {
      font-size: 36px;
      font-weight: bold;
      width: 72px;
      height: 72px;
      padding: 10px;
      border: none;
      border-radius: 10px;
      color: white;
      background: #4CAF50;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
      transition: background 0.2s ease;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    button.active {
      background-color: #ff9800;
      box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.3);
    }

    /* Directional Controls */
    .controls {
      display: grid;
      grid-template-columns: repeat(3, 72px);
      grid-gap: 10px;
      justify-content: center;
      align-items: center;
      margin: 10px 0;
    }

    .rotation-controls {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-bottom: 10px;
    }

    /* Mode Switch Button */
    .mode-switch-button {
      background: #2196F3;
      font-size: 14px;
      width: 80px;
      height: 80px;
      padding: 8px;
      border-radius: 10px;
      color: white;
      border: none;
      cursor: pointer;
      transition: background 0.2s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      text-align: center;
    }

    .mode-switch-button:hover {
      background: #1976D2;
    }

    /* 90° Turn Control */
    .turn-90-control {
      background: rgba(0, 0, 0, 0.05);
      padding: 10px;
      border-radius: 8px;
      margin: 0 auto 15px auto;
      width: fit-content;
      transition: all 0.3s;
    }

    .turn-90-control.active {
      background: rgba(0, 150, 255, 0.15);
      border-left: 4px solid #2196F3;
    }

    .turn-90-control label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    .turn-90-control input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    /* Horn Button */
    .horn-control {
      margin: 20px 0;
    }

    .horn-control button {
      width: 200px;
      height: auto;
      padding: 15px;
      font-size: 20px;
      background: #ff9800;
    }

    .horn-control button:hover {
      background: #e68a00;
    }

    .horn-control button.active {
      background: #f44336;
    }

    /* Speed Slider */
    #sliderContainer {
      margin-top: 10px;
    }

    input[type=range] {
      width: 90%;
      max-width: 260px;
    }

    #sliderValue {
      margin-top: 6px;
      font-size: 16px;
    }

    @media (max-height: 700px) {
      .content-container {
        max-height: 90vh;
        /* Slightly smaller on very short screens */
      }

      body {
        background-size: 300px auto;
        /* Slightly smaller background */
      }
    }

    /* Responsive Adjustments */
    @media (max-width: 600px) {
      button {
        width: 64px;
        height: 64px;
        font-size: 32px;
      }

      .controls {
        grid-template-columns: repeat(3, 64px);
        grid-gap: 8px;
      }

      .rotation-controls {
        gap: 8px;
      }
    }
  </style>
</head>

<body>
  <div class="content-container">
    <div class="header-container">
      <button class="mode-switch-button" onclick="setAutoMode()">
        وضع تلقائي
      </button>
      <h2>تحكم يدوي<br>🕹️</h2>
      <div class="spacer"></div> <!-- This balances the layout -->
    </div>
    <div class="controls">
      <div></div>
      <button id="forward">▲</button>
      <div></div>

      <button id="left" onmousedown="handleButtonPress('left', true)" onmouseup="handleButtonPress('left', false)"
        onmouseleave="handleButtonPress('left', false)" ontouchstart="touchMove(event, 'left')"
        ontouchend="touchMove(event, 'left')">►</button>
      <div></div>
      <button id="right" onmousedown="handleButtonPress('right', true)" onmouseup="handleButtonPress('right', false)"
        onmouseleave="handleButtonPress('right', false)" ontouchstart="touchMove(event, 'right')"
        ontouchend="touchMove(event, 'right')">◄</button>

      <div></div>
      <button id="backward" onmousedown="handleButtonPress('backward', true)"
        onmouseup="handleButtonPress('backward', false)" onmouseleave="handleButtonPress('backward', false)"
        ontouchstart="touchMove(event, 'backward')" ontouchend="touchMove(event, 'backward')">▼</button>
      <div></div>
    </div>

    <div class="rotation-controls">
      <button id="ccw" onmousedown="handleButtonPress('ccw', true)" onmouseup="handleButtonPress('ccw', false)"
        ontouchstart="handleTouchRotation('ccw', true)" ontouchend="handleTouchRotation('ccw', false)">↺</button>

      <button id="cw" onmousedown="handleButtonPress('cw', true)" onmouseup="handleButtonPress('cw', false)"
        ontouchstart="handleTouchRotation('cw', true)" ontouchend="handleTouchRotation('cw', false)">↻</button>
    </div>

    <div class="turn-90-control" id="turn90Control">
      <label>
        <input type="checkbox" id="enable90Turn" checked onchange="toggle90TurnMode()">
        <span id="turnModeText">وضع 90°</span>
      </label>
    </div>
    <div class="horn-control">
      <button id="horn" onmousedown="activateHorn()" onmouseup="deactivateHorn()" ontouchstart="touchHorn(event, true)"
        ontouchend="touchHorn(event, false)">
        🔊 بوق
      </button>
    </div>

    <div id="sliderContainer">
      <input type="range" id="speedSlider" min="30" max="100" value="50" oninput="updateSlider()"
        onkeydown="event.preventDefault()">
      <div id="sliderValue">السرعة: 50%</div>
    </div>
  </div>

<script src="/scripts/manual.js"></script>
</body>

</html>
